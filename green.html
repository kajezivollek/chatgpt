<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>City</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body data-title-key="nav.green">
<header id="site-header" data-page="green"></header>

<div class="page-head"><div class="wrap">
  <h1 data-t="gr.title"></h1>
  <p data-t="gr.intro"></p>
</div></div>

<main class="wrap">
  <section id="transit" class="station card grid-2 feature">
    <div>
      <h2><span data-t="gr.transitTitle"></span></h2>
      <p data-t="gr.transit"></p>
      <div class="audio" data-audio="4"></div>
    </div>
    <figure class="photo" data-photo="photos/transit-map.jpg" data-cap="gr.mapCap"></figure>
  </section>

  <section id="energy-parks" class="station card grid-2 feature flip">
      <div>
        <h2><span data-t="gr.energyTitle"></span></h2>
        <p data-t="gr.energy"></p>
        <h2><span data-t="gr.parksTitle"></span></h2>
        <p data-t="gr.parks"></p>
        <div class="audio" data-audio="5"></div>
      </div>
      <figure class="photo" data-photo="photos/eco-balance.jpg" data-cap="gr.ecoCap"></figure>
  </section>
</main>

<footer id="site-footer"></footer>
<script src="js/content.js"></script>
<script src="js/site.js"></script>
</body>
</html>
