<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mostberg</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body data-title-key="nav.landmarks">
<header id="site-header" data-page="landmarks"></header>

<div class="page-head"><div class="wrap">
  <h1 data-t="lm.title"></h1>
  <p data-t="lm.intro"></p>
</div></div>

<main class="wrap">
  <section id="town-hall" class="station card grid-2">
    <div>
      <h2>🏛️ <span data-t="lm.townhallTitle"></span></h2>
      <p data-t="lm.townhall"></p>
    </div>
    <figure class="photo" data-photo="photos/town-hall.jpg" data-cap="lm.pair2"></figure>
  </section>

  <section id="landmark" class="station card grid-2">
    <div>
      <h2>🗼 <span data-t="lm.landmarkTitle"></span></h2>
      <p data-t="lm.landmark"></p>
      <div class="audio" data-audio="2"></div>
    </div>
    <figure class="photo" data-photo="photos/landmark.jpg" data-cap="lm.pair1"></figure>
  </section>

  <section id="school-hospital" class="station card">
    <div class="grid-2">
      <div>
        <h2>🏫 <span data-t="lm.schoolTitle"></span></h2>
        <p data-t="lm.school"></p>
        <h2>🏥 <span data-t="lm.hospitalTitle"></span></h2>
        <p data-t="lm.hospital"></p>
        <div class="audio" data-audio="3"></div>
      </div>
      <div class="photos-2">
        <figure class="photo" data-photo="photos/school.jpg" data-cap="lm.schoolTitle"></figure>
        <figure class="photo" data-photo="photos/hospital.jpg" data-cap="lm.hospitalTitle"></figure>
      </div>
    </div>
  </section>
</main>

<footer id="site-footer"></footer>
<script src="js/content.js"></script>
<script src="js/site.js"></script>
</body>
</html>
